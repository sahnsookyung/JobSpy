name: Validate and publish JobSpy image

on:
  pull_request:
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jobspy-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    env:
      IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/jobspy
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Build native ARM64 image
        run: docker build -f Dockerfile.arm64 --label "org.opencontainers.image.revision=$GITHUB_SHA" -t jobspy-verified:test .
      - name: Run API and scraper regressions
        run: |
          docker run --rm --init --pids-limit 512 --memory 2g --cpus 1.5 \
            jobspy-verified:test python -m unittest \
            test_api_server test_browser_runtime test_tokyodev_scraper test_japandev_scraper test_process_cleanup -v
      - name: Run 50 real Chromium cleanup cycles
        run: |
          docker run --rm --init --pids-limit 512 --memory 2g --cpus 1.5 \
            --shm-size 1g --tmpfs /tmp:size=256m -e PYTHONPATH=/app \
            jobspy-verified:test python tests/browser_cleanup_stress.py
      - name: Install verified Grype scanner
        run: |
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsSLo grype.tar.gz \
            https://github.com/anchore/grype/releases/download/v0.119.0/grype_0.119.0_linux_arm64.tar.gz
          echo '29f0ec7c549ddb0e2b6a0ca714851f7399438afc399b80c12808e065edc9a8f8  grype.tar.gz' | sha256sum -c
          tar -xzf grype.tar.gz grype
          sudo install -m 0755 grype /usr/local/bin/grype
      - name: Block high and critical vulnerabilities
        run: |
          grype docker:jobspy-verified:test --fail-on high --output json --file grype.json
          docker run --rm --init jobspy-verified:test python tests/browser_inventory.py > browser.cdx.json
          grype sbom:browser.cdx.json --fail-on high --output json --file browser-grype.json
      - name: Retain vulnerability scan evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: jobspy-arm64-security
          path: |
            grype.json
            browser.cdx.json
            browser-grype.json
          retention-days: 30
      - name: Publish only the verified image
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          tag="${GITHUB_REF_NAME#v}"
          docker tag jobspy-verified:test "$IMAGE_NAME:$tag"
          docker push "$IMAGE_NAME:$tag"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE_NAME:$tag")"
          printf 'Verified ARM64 image: %s\n' "$digest" >> "$GITHUB_STEP_SUMMARY"
